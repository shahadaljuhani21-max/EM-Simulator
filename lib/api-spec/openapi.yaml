openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /downloads/ai-case-pack-files:
    get:
      operationId: downloadAiCasePackFiles
      summary: Download the permanent core case-generation source pack
      responses:
        "200":
          description: ZIP containing Creator, official objectives, reference context and readme
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /downloads/ai-case-pack-creator:
    get:
      operationId: downloadAiCasePackCreator
      summary: Download the self-contained AI case pack creator
      responses:
        "200":
          description: Creator file served as a downloadable attachment
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

